[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hangtian"
version = "0.1.0"
description = "Evidence-grounded telemetry case and task factory research scaffold"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hangtian = "hangtian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
